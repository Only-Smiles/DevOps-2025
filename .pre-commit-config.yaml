repos:
  - repo: https://github.com/rubocop/rubocop
    rev: v1.77.0
    hooks:
      - id: rubocop
        stages: [pre-push]

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: bundler-audit
        stages: [pre-push]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        stages: [pre-push]


# pre-commit run --all-files    