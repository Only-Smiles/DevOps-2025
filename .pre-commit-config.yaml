repos:
  - repo: https://github.com/rubocop/rubocop
    rev: v1.24.1
    hooks:
      - id: rubocop

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: master
    hooks:
      - id: bundler-audit

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
